services:
  simplewatch:
    build: .
    container_name: simplewatch
    ports:
      - "5050:5050"
    volumes:
      - simplewatch-data:/data
      - simplewatch-logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5050/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Named volumes keep the database and logs under Docker's management (snapshot,
# back up, and move them without a loose file in the project directory).
# Back up:    docker run --rm -v simplewatch-data:/data -v "$PWD":/backup alpine tar czf /backup/simplewatch-backup.tgz -C /data .
# Restore:    docker run --rm -v simplewatch-data:/data -v "$PWD":/backup alpine sh -c "cd /data && tar xzf /backup/simplewatch-backup.tgz"
volumes:
  simplewatch-data:
  simplewatch-logs:
