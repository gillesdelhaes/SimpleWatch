<!DOCTYPE html>
<html lang="en" data-theme="dark" data-app="watch">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <title>SimpleWatch</title>
    <script>
        const param = new URLSearchParams(location.search).get('theme')
        document.documentElement.dataset.theme =
          param === 'light' || param === 'dark' ? param
            : localStorage.getItem('sw-theme') === 'light' ? 'light' : 'dark'
    </script>
    <link rel="stylesheet" href="/static/css/glasshouse.css" />
    <script>
        // Check setup status first, then redirect appropriately
        async function checkAndRedirect() {
            try {
                // Check if setup is completed
                const response = await fetch('/api/v1/setup/status');
                const data = await response.json();

                if (!data.setup_completed) {
                    // Setup not completed, redirect to setup
                    window.location.href = '/static/setup.html';
                    return;
                }

                // Setup completed, check if user is logged in
                if (localStorage.getItem('token')) {
                    window.location.href = '/static/dashboard.html';
                } else {
                    window.location.href = '/static/login.html';
                }
            } catch (error) {
                // If setup check fails, try to redirect to login as fallback
                console.error('Failed to check setup status:', error);
                if (localStorage.getItem('token')) {
                    window.location.href = '/static/dashboard.html';
                } else {
                    window.location.href = '/static/login.html';
                }
            }
        }

        checkAndRedirect();
    </script>
</head>
<body>
    <div class="aura"></div>
    <p style="padding:24px;font-size:13px;color:var(--ink-2)">Redirecting…</p>
</body>
</html>
