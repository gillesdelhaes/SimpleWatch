<!DOCTYPE html>
<html lang="en" data-theme="dark" data-app="watch">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <title>Sign in — SimpleWatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script>
    // Restore persisted theme before first paint to avoid a flash.
    // ?theme=light|dark overrides for previews without touching the saved choice.
    const param = new URLSearchParams(location.search).get('theme')
    document.documentElement.dataset.theme =
      param === 'light' || param === 'dark'
        ? param
        : localStorage.getItem('sw-theme') === 'light' ? 'light' : 'dark'
  </script>
  <link rel="stylesheet" href="/static/css/glasshouse.css" />
  <link rel="stylesheet" href="/static/css/watch.css" />
</head>
<body>

<div class="split">
  <section class="brand-side">
    <div class="wordmark-xl"><span class="lite">Simple</span><span class="brand">Watch</span></div>
    <p class="tag">Monitor your services in under 60 seconds. Websites, APIs, certificates, heartbeats — no coding required.</p>
    <div class="shard s1">
      <span class="ico"><svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 9h3l2-4.5L10 13l2.5-6 1.5 2h2.5"/></svg></span>
      <span><b>13 monitor types</b><br>set up in the UI, no code</span>
    </div>
    <div class="shard s2">
      <span class="ico"><svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="9" r="7"/><path d="M9 5v4l2.5 2.5"/></svg></span>
      <span><b>Incident tracking</b><br>MTTR &amp; uptime built in</span>
    </div>
  </section>

  <section class="form-side">
    <form class="login-card" id="loginForm">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to your SimpleWatch workspace.</p>

      <div id="loginError" class="login-error"></div>

      <div class="fieldrow">
        <label for="username">Username</label>
        <input class="input" id="username" type="text" placeholder="your-username" autocomplete="username" required autofocus />
      </div>

      <div class="fieldrow">
        <label for="password">Password</label>
        <div style="position:relative">
          <input class="input" id="password" type="password" placeholder="••••••••••" autocomplete="current-password" required style="padding-right:42px" />
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="btn" type="submit" id="submitBtn">Sign in</button>

      <p class="ssonote"><i></i> Self-hosted · your data stays yours</p>
    </form>
  </section>
</div>

<script src="/static/js/theme.js"></script>
<script src="/static/js/api.js"></script>
<script>
  // Check setup status on load
  async function checkSetupStatus() {
    try {
      const res = await fetch('/api/v1/setup/status');
      const data = await res.json();
      if (!data.setup_completed) {
        window.location.href = '/static/setup.html';
      }
    } catch (e) {
      console.error('Setup check failed', e);
    }
  }
  checkSetupStatus();

  // Redirect if already authenticated
  if (localStorage.getItem('token')) {
    window.location.href = '/static/dashboard.html';
  }

  // Password visibility toggle
  const pwInput  = document.getElementById('password');
  const pwToggle = document.getElementById('pwToggle');
  const eyeIcon  = document.getElementById('eyeIcon');

  const eyeOpen = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  const eyeOff  = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;

  pwToggle.addEventListener('click', () => {
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    eyeIcon.innerHTML = show ? eyeOff : eyeOpen;
    pwToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  // Login form
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl   = document.getElementById('loginError');
    const submitBtn = document.getElementById('submitBtn');

    errorEl.classList.remove('visible');
    submitBtn.disabled = true;
    submitBtn.innerHTML = `
      <svg class="spin" width="15" height="15" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-opacity="0.3" stroke-width="2"/>
        <path d="M8 2a6 6 0 0 1 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Signing in…`;

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      await api.login(username, password);
      window.location.href = '/static/dashboard.html';
    } catch (err) {
      errorEl.textContent = err.message || 'Sign in failed — check your username and password.';
      errorEl.classList.add('visible');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
