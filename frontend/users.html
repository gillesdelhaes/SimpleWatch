<!DOCTYPE html>
<html lang="en" data-theme="dark" data-app="watch">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <title>Users - SimpleWatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
        const param = new URLSearchParams(location.search).get('theme')
        document.documentElement.dataset.theme =
          param === 'light' || param === 'dark' ? param
            : localStorage.getItem('sw-theme') === 'light' ? 'light' : 'dark'
    </script>
    <link rel="stylesheet" href="/static/css/glasshouse.css">
    <link rel="stylesheet" href="/static/css/watch.css">
    <link rel="stylesheet" href="/static/css/users.css">
    <link rel="stylesheet" href="/static/css/ai-sre.css">
</head>
<body>
    <div id="navigation" data-page="users"></div>

    <div class="page-actions">
        <button onclick="showAddUserModal()" class="btn">+ Add User</button>
    </div>

    <div id="usersList" class="panel users-list"></div>

    <!-- Add User Modal -->
    <div id="addUserModalScrim" class="scrim" onclick="hideAddUserModal()"></div>
    <div id="addUserModal" class="modal" role="dialog" aria-modal="true">
        <h2>Add user</h2>
        <p class="sub">Create an account for a teammate.</p>
        <form id="addUserForm">
            <div class="fieldrow">
                <label for="newUsername">Username</label>
                <input type="text" id="newUsername" class="input">
                <div class="field-error" id="newUsernameError"></div>
                <p class="form-hint" id="addUserUsernameHint">Minimum 3 characters</p>
            </div>
            <div class="fieldrow">
                <label for="newPassword">Password</label>
                <input type="password" id="newPassword" class="input">
                <div class="field-error" id="newPasswordError"></div>
                <p class="form-hint" id="addUserPasswordHint">Minimum 8 characters</p>
            </div>
            <div class="fieldrow">
                <label for="newEmail">Email (optional)</label>
                <input type="email" id="newEmail" class="input">
            </div>
            <div class="fieldrow">
                <label class="checkbox-label">
                    <input type="checkbox" id="newIsAdmin">
                    <span>Grant admin privileges</span>
                </label>
            </div>
            <div class="modal-actions">
                <button type="button" onclick="hideAddUserModal()" class="btn ghost">Cancel</button>
                <button type="submit" class="btn">Create User</button>
            </div>
        </form>
    </div>

    <!-- Change Password Modal -->
    <div id="changePasswordModalScrim" class="scrim" onclick="hideChangePasswordModal()"></div>
    <div id="changePasswordModal" class="modal" role="dialog" aria-modal="true">
        <h2>Change password</h2>
        <p class="sub">User: <span id="changePasswordUsername"></span></p>
        <form id="changePasswordForm">
            <div id="currentPasswordField" class="fieldrow hidden">
                <label for="currentPassword">Current password</label>
                <input type="password" id="currentPassword" class="input">
                <div class="field-error" id="currentPasswordError"></div>
            </div>
            <div class="fieldrow">
                <label for="changeNewPassword">New password</label>
                <input type="password" id="changeNewPassword" class="input">
                <div class="field-error" id="changeNewPasswordError"></div>
                <p class="form-hint" id="changePasswordHint">Minimum 8 characters</p>
            </div>
            <div class="fieldrow">
                <label for="confirmNewPassword">Confirm new password</label>
                <input type="password" id="confirmNewPassword" class="input">
                <div class="field-error" id="confirmNewPasswordError"></div>
            </div>
            <div class="modal-actions">
                <button type="button" onclick="hideChangePasswordModal()" class="btn ghost">Cancel</button>
                <button type="submit" class="btn">Change Password</button>
            </div>
        </form>
    </div>

    <script src="/static/js/components.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/nav.js"></script>
    <script src="/static/js/validation.js"></script>
    <script src="/static/js/users.js"></script>
</body>
</html>
